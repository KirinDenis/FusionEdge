; FusionEdge for the ESP32-2432S028R, the 2.8" "Cheap Yellow Display": a classic ESP32 with
; 4 MB of flash and no PSRAM. Copy this file and myoptions.h over the ones in the project's root.
;
; Without PSRAM (BOARD_NO_PSRAM): the screen is drawn in strips by src/lite (core/display_lite.cpp)
; instead of FusionEdge's sprites, the audio buffers are small and play MP3 and AAC
; (audioI2S/Audio.cpp), and the sound comes from the ESP32's own DAC on GPIO 26
; (AUDIO_INTERNAL_DAC). The LittleFS image is built from build-data/, which
; .github/board-data.sh fills from this folder's data.txt.

[platformio]
data_dir = build-data

[env:esp32-2432s028r]
; Arduino Release v3.3.7 based on ESP-IDF v5.5.2.260206
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
; the generic "ESP32 Dev Module", as src/core/optionschecker.h asks: the pins are all in myoptions.h
board = esp32dev
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_4mb.csv

board_build.filesystem = littlefs

build_flags =
    -DBOARD_NO_PSRAM
    -DLITE_UI
    -DAUDIO_INTERNAL_DAC
    -DLITE_SCREEN_W=320
    -DLITE_SCREEN_H=240
    -fno-exceptions
    -Wall
    -Wextra
    -O2
    -fdiagnostics-color=always
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++20
    -D LGFX_USE_PNG

build_unflags = -std=gnu++11

lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit NeoPixel@^1.12.3
    lovyan03/LovyanGFX@^1.2.19

upload_speed = 460800
upload_resetmethod = nodemcu
upload_protocol = esptool
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset

monitor_speed = 460800
monitor_rts = 0
monitor_dtr = 0
